# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/notes/webserver.pid;
error_log /var/log/sdkwork/notes/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name notes-demo.sdkwork.com notes-demo.birdcoder.com notes-demo.dtupay.com notes-demo.noaper.com notes-demo.sdkwork.cn notes-demo.birdcoder.cn notes-demo.dtupay.cn notes-demo.noaper.cn notes-demo.skubc.com notes-demo.skubc.cn notes-demo.zowalk.com notes-demo.zowalk.cn notes-demo.offer86.com notes-demo.offer86.cn notes-demo.86offer.com notes-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/notes/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
